name: Bug 报告
description: 报告可复现的功能、数据或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请先移除账户、持仓、本机路径和其他敏感信息。"
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 选择…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: commit SHA / release tag
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.13 / Chrome…
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请脱敏后粘贴；不要上传数据库或真实交易数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复问题。
          required: true
        - label: 我已移除隐私和敏感信息。
          required: true

