name: 功能建议
description: 提议新的策略研究、数据、交互或工程能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景和当前痛点，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 包括交互、输入输出、回测口径或兼容性影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案与补充信息

